name: bet9ja-vfl-production

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-labels: &app-labels
  com.bet9ja-vfl.release: "${RELEASE_SHA:?Set RELEASE_SHA to an immutable Git commit SHA}"
  com.bet9ja-vfl.managed-by: "compose"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vfl}
      POSTGRES_USER: ${POSTGRES_USER:-vfl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS environment file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 2g
    cpus: "1.50"
    stop_grace_period: 60s
    logging: *default-logging
    networks:
      - backend

  migrate:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX, for example ghcr.io/owner/repository}/vfl-api:${RELEASE_SHA:?Set RELEASE_SHA to an immutable Git commit SHA}
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vfl}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS environment file}@postgres:5432/${POSTGRES_DB:-vfl}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    labels: *app-labels
    mem_limit: 512m
    cpus: "0.50"
    logging: *default-logging
    networks:
      - backend

  # One-shot Phase 6 research gates are intentionally isolated from the
  # ordinary migration runner. Replay retains a complete report in memory and
  # must not compete with the 512 MB migration budget.
  phase6-research:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX, for example ghcr.io/owner/repository}/vfl-api:${RELEASE_SHA:?Set RELEASE_SHA to an immutable Git commit SHA}
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vfl}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS environment file}@postgres:5432/${POSTGRES_DB:-vfl}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    labels: *app-labels
    mem_limit: 1536m
    cpus: "1.25"
    logging: *default-logging
    networks:
      - backend

  api:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX, for example ghcr.io/owner/repository}/vfl-api:${RELEASE_SHA:?Set RELEASE_SHA to an immutable Git commit SHA}
    restart: unless-stopped
    command: ["-listen", "0.0.0.0:8090"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vfl}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS environment file}@postgres:5432/${POSTGRES_DB:-vfl}?sslmode=disable
      RUN_MIGRATIONS: "false"
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in the VPS environment file}
      APP_ENV: production
      AUTHORIZED_EMAIL: ${AUTHORIZED_EMAIL:?Set AUTHORIZED_EMAIL in the VPS environment file}
      APP_BASE_URL: https://${APP_DOMAIN:-app.vflpredict.win}
      COOKIE_SECURE: "true"
      MAGIC_LINK_TTL_MINUTES: ${MAGIC_LINK_TTL_MINUTES:-10}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      MAILER_MODE: resend
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in the VPS environment file}
      RESEND_API_URL: ${RESEND_API_URL:-https://api.resend.com}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM to a verified Resend sender}
      AUTOBET_CREDENTIALS_ENCRYPTION_KEY: ${AUTOBET_CREDENTIALS_ENCRYPTION_KEY:?Set AUTOBET_CREDENTIALS_ENCRYPTION_KEY in the VPS environment file}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "0.75"
    stop_grace_period: 20s
    labels: *app-labels
    logging: *default-logging
    networks:
      - backend

  web:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX, for example ghcr.io/owner/repository}/vfl-web:${RELEASE_SHA:?Set RELEASE_SHA to an immutable Git commit SHA}
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8090
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: "1.00"
    stop_grace_period: 20s
    labels: *app-labels
    logging: *default-logging
    networks:
      - backend

  live-monitor:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX, for example ghcr.io/owner/repository}/vfl-worker:${RELEASE_SHA:?Set RELEASE_SHA to an immutable Git commit SHA}
    restart: unless-stopped
    entrypoint: ["/app/live-monitor"]
    command: ["-allow-network"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vfl}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS environment file}@postgres:5432/${POSTGRES_DB:-vfl}?sslmode=disable
      RUN_MIGRATIONS: "false"
      BET9JA_CONNECTIVITY_ENABLED: ${BET9JA_CONNECTIVITY_ENABLED:-false}
      BET9JA_TOURNAMENT_ID: ${BET9JA_TOURNAMENT_ID:-14149}
      BET9JA_HISTORICAL_BASE_URL: ${BET9JA_HISTORICAL_BASE_URL:?Set BET9JA_HISTORICAL_BASE_URL in the VPS environment file}
      BET9JA_LIVE_BASE_URL: ${BET9JA_LIVE_BASE_URL:?Set BET9JA_LIVE_BASE_URL in the VPS environment file}
      BET9JA_REQUEST_SPACING_SECONDS: ${BET9JA_REQUEST_SPACING_SECONDS:-10}
      BET9JA_REQUEST_TIMEOUT_SECONDS: ${BET9JA_REQUEST_TIMEOUT_SECONDS:-30}
      BET9JA_MAX_RETRIES: ${BET9JA_MAX_RETRIES:-3}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "0.75"
    stop_grace_period: 30s
    labels: *app-labels
    logging: *default-logging
    networks:
      - backend

  prediction-worker:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX, for example ghcr.io/owner/repository}/vfl-worker:${RELEASE_SHA:?Set RELEASE_SHA to an immutable Git commit SHA}
    restart: unless-stopped
    entrypoint: ["/app/prediction-worker"]
    command: ["-interval", "60s", "-auto-freeze"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vfl}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS environment file}@postgres:5432/${POSTGRES_DB:-vfl}?sslmode=disable
      RUN_MIGRATIONS: "false"
      PREDICTION_MODEL: ${PREDICTION_MODEL:-dynamic_bayesian_team_strength}
      PREDICTION_SAFETY_BUFFER_SECONDS: ${PREDICTION_SAFETY_BUFFER_SECONDS:-30}
      PREDICTION_FREEZE_LEAD_SECONDS: ${PREDICTION_FREEZE_LEAD_SECONDS:-90}
      PREDICTION_GENERATION_TIMEOUT_SECONDS: ${PREDICTION_GENERATION_TIMEOUT_SECONDS:-90}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: "0.75"
    stop_grace_period: 30s
    labels: *app-labels
    logging: *default-logging
    networks:
      - backend

  settlement-worker:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX, for example ghcr.io/owner/repository}/vfl-worker:${RELEASE_SHA:?Set RELEASE_SHA to an immutable Git commit SHA}
    restart: unless-stopped
    entrypoint: ["/app/settlement-worker"]
    command: ["-interval", "10s"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vfl}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the VPS environment file}@postgres:5432/${POSTGRES_DB:-vfl}?sslmode=disable
      RUN_MIGRATIONS: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    cpus: "0.50"
    stop_grace_period: 30s
    labels: *app-labels
    logging: *default-logging
    networks:
      - backend

  auto-betting-worker:
    image: ${GHCR_IMAGE_PREFIX:?Set GHCR_IMAGE_PREFIX, for example ghcr.io/owner/repository}/vfl-autobet:${RELEASE_SHA:?Set RELEASE_SHA to an immutable Git commit SHA}
    restart: unless-stopped
    init: true
    environment:
      INTERNAL_API_BASE_URL: http://api:8090
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in the VPS environment file}
      DEBUG: ${AUTOBET_DEBUG:-}
      AUTOBET_INTERVAL_SECONDS: ${AUTOBET_INTERVAL_SECONDS:-10}
      AUTOBET_HEADLESS: ${AUTOBET_HEADLESS:-true}
      AUTOBET_DRY_RUN: ${AUTOBET_DRY_RUN:-false}
      # Credentials are API-backed; use an ephemeral profile to avoid cross-container Chromium locks.
      AUTOBET_USER_DATA_DIR: /tmp/autobet-browser
      BET9JA_VIRTUAL_URL: ${BET9JA_VIRTUAL_URL:-https://virtual.bet9ja.com/virtual/}
      BET9JA_VFL_TOURNAMENT_NAME: ${BET9JA_VFL_TOURNAMENT_NAME:-Euro League}
      BET9JA_USERNAME: ${BET9JA_USERNAME:-}
      BET9JA_PASSWORD: ${BET9JA_PASSWORD:-}
      BET9JA_LOGIN_TRIGGER_SELECTORS: ${BET9JA_LOGIN_TRIGGER_SELECTORS:-}
      BET9JA_USERNAME_SELECTORS: ${BET9JA_USERNAME_SELECTORS:-}
      BET9JA_PASSWORD_SELECTORS: ${BET9JA_PASSWORD_SELECTORS:-}
      BET9JA_LOGIN_SUBMIT_SELECTORS: ${BET9JA_LOGIN_SUBMIT_SELECTORS:-}
      BET9JA_LOGOUT_INDICATORS: ${BET9JA_LOGOUT_INDICATORS:-}
      BET9JA_TOURNAMENT_SELECTORS: ${BET9JA_TOURNAMENT_SELECTORS:-}
      BET9JA_MATCH_ROW_SELECTORS: ${BET9JA_MATCH_ROW_SELECTORS:-}
      BET9JA_MATCH_EXPAND_SELECTORS: ${BET9JA_MATCH_EXPAND_SELECTORS:-}
      BET9JA_OVER15_SELECTORS: ${BET9JA_OVER15_SELECTORS:-}
      BET9JA_STAKE_SELECTORS: ${BET9JA_STAKE_SELECTORS:-}
      BET9JA_PLACE_BET_SELECTORS: ${BET9JA_PLACE_BET_SELECTORS:-}
      BET9JA_CONFIRM_SELECTORS: ${BET9JA_CONFIRM_SELECTORS:-}
      BET9JA_BET_REFERENCE_SELECTORS: ${BET9JA_BET_REFERENCE_SELECTORS:-}
      BET9JA_BETSLIP_REMOVE_SELECTORS: ${BET9JA_BETSLIP_REMOVE_SELECTORS:-}
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    shm_size: "512m"
    pids_limit: 256
    mem_limit: 1024m
    cpus: "1.00"
    stop_grace_period: 30s
    labels: *app-labels
    logging: *default-logging
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.vflpredict.win}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for Caddy certificate notifications}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 256m
    cpus: "0.50"
    stop_grace_period: 20s
    labels: *app-labels
    logging: *default-logging
    networks:
      - edge
      - backend

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres-data:
    name: bet9ja-vfl-production-postgres-data
  caddy-data:
    name: bet9ja-vfl-production-caddy-data
  caddy-config:
    name: bet9ja-vfl-production-caddy-config
