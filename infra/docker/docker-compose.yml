name: bet9ja-vfl-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vfl}
      POSTGRES_USER: ${POSTGRES_USER:-vfl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file or the shell}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - private

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    # Dockerfile.api provides /app/ops-api as ENTRYPOINT; pass only its flags.
    command: ["-listen", "0.0.0.0:8090"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-vfl}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in an untracked .env file or the shell}@postgres:5432/${POSTGRES_DB:-vfl}?sslmode=disable
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in an untracked .env file or the shell}
      APP_ENV: ${APP_ENV:-development}
      AUTHORIZED_EMAIL: ${AUTHORIZED_EMAIL:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAGIC_LINK_TTL_MINUTES: ${MAGIC_LINK_TTL_MINUTES:-10}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      AUTH_RATE_LIMIT_WINDOW_MINUTES: ${AUTH_RATE_LIMIT_WINDOW_MINUTES:-15}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-5}
      MAILER_MODE: ${MAILER_MODE:-memory}
      EMAIL_PROVIDER_URL: ${EMAIL_PROVIDER_URL:-}
      EMAIL_PROVIDER_TOKEN: ${EMAIL_PROVIDER_TOKEN:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8090
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    networks:
      - private

networks:
  private:
    driver: bridge

volumes:
  postgres-data:
