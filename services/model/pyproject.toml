[project]
name = "bet9ja-vfl-contracts"
version = "0.1.0"
description = "Bet9ja VFL provider contracts and Phase 3.5 research model service"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "lightgbm>=4.5,<5",
]

[project.scripts]
bet9ja-vfl-phase35 = "vfl_lgbm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vfl_contracts*", "vfl_lgbm*"]

[tool.ruff]
target-version = "py312"
line-length = 100
