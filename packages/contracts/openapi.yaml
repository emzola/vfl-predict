openapi: 3.1.0
info:
  title: Bet9ja VFL internal API
  version: 0.6.0-phase6
  description: >-
    Authenticated application endpoints backed by the existing Go API and
    PostgreSQL records. Provider responses, retrospective odds, and genuine
    forward observations retain separate provenance. Phase 6 prediction
    payloads may include unified scoreline markets and dynamic team-state
    diagnostics. No endpoint places bets.
  x-contract-status: implemented-application-boundary-provider-semantics-unchanged
paths:
  /api/v1/auth/request-link:
    post:
      summary: Request a single-use sign-in link
      operationId: requestMagicLink
      description: Returns the same response for authorized and unauthorized addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                redirect:
                  type: string
                  pattern: '^/dashboard(?:/.*)?$'
      responses:
        '202':
          description: Generic response
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/verify:
    get:
      summary: Consume a single-use sign-in link
      operationId: verifyMagicLink
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            minLength: 32
        - name: redirect
          in: query
          required: false
          schema:
            type: string
            pattern: '^/dashboard(?:/.*)?$'
      responses:
        '302':
          description: Session created and redirected to an allowlisted dashboard path
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/me:
    get:
      summary: Read current authenticated session
      operationId: getCurrentSession
      security: [{ cookieSession: [] }]
      responses:
        '200':
          description: Current session
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/sessions:
    get:
      summary: List current account sessions
      operationId: listSessions
      security: [{ cookieSession: [] }]
      responses:
        '200':
          description: Active and revoked sessions for the configured account
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/sessions/{sessionId}/revoke:
    post:
      summary: Revoke one account session
      operationId: revokeSession
      security: [{ cookieSession: [], csrfHeader: [] }]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session revocation result
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/logout:
    post:
      summary: Revoke current session
      operationId: logout
      security: [{ cookieSession: [], csrfHeader: [] }]
      responses:
        '200':
          description: Session revoked
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/dashboard/overview:
    get:
      summary: Read dashboard overview
      operationId: getDashboardOverview
      security: [{ cookieSession: [] }]
      responses:
        '200':
          description: Current season, round, readiness, freshness, and forward summary
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/dashboard/future-rounds:
    get:
      summary: Read grouped future provisional rounds
      operationId: getFutureRounds
      security: [{ cookieSession: [] }]
      parameters:
        - name: season_id
          in: query
          schema:
            $ref: '#/components/schemas/SeasonId'
      responses:
        '200':
          description: Provisional groups with completeness and provenance
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/dashboard/history:
    get:
      summary: Search stored prediction revisions
      operationId: searchPredictionHistory
      security: [{ cookieSession: [] }]
      parameters:
        - name: season_id
          in: query
          schema:
            $ref: '#/components/schemas/SeasonId'
        - name: round
          in: query
          schema:
            $ref: '#/components/schemas/Round'
        - name: status
          in: query
          schema:
            type: string
        - name: model
          in: query
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: Immutable prediction revision archive
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/seasons:
    get:
      summary: List stored seasons
      operationId: listSeasons
      security: [{ cookieSession: [] }]
      responses:
        '200':
          description: Bounded season list
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/seasons/{seasonId}/rounds:
    get:
      summary: List stored rounds for a season
      operationId: listSeasonRounds
      security: [{ cookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SeasonId'
      responses:
        '200':
          description: Round state and coverage list
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/predictions:
    get:
      summary: List persisted prediction revisions for a bounded selection
      operationId: listPredictions
      security: [{ cookieSession: [] }]
      parameters:
        - name: season_id
          in: query
          schema:
            $ref: '#/components/schemas/SeasonId'
        - name: round
          in: query
          schema:
            $ref: '#/components/schemas/Round'
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Prediction page with completeness and provenance
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/matches/{matchId}:
    get:
      summary: Read a fixture, stored odds, and stored predictions
      operationId: getMatchDetail
      security: [{ cookieSession: [] }]
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MatchId'
      responses:
        '200':
          description: Match detail with odds provenance
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/performance:
    get:
      summary: Read retrospective model metrics
      operationId: getPerformance
      security: [{ cookieSession: [] }]
      responses:
        '200':
          description: Retrospective metrics kept separate from forward evidence
  /api/v1/paper-testing:
    get:
      summary: Read genuine forward paper-testing metrics
      operationId: getPaperTesting
      security: [{ cookieSession: [] }]
      responses:
        '200':
          description: Forward-observed settlement summary and metrics
  /api/v1/operations:
    get:
      summary: Read worker, feed, lease, quarantine, and coverage state
      operationId: getOperations
      security: [{ cookieSession: [] }]
      responses:
        '200':
          description: Operational diagnostics without secrets
  /api/v1/settings:
    get:
      summary: Read owner preferences
      operationId: getSettings
      security: [{ cookieSession: [] }]
    patch:
      summary: Update owner display preferences
      operationId: updateSettings
      security: [{ cookieSession: [], csrfHeader: [] }]
  /api/v1/system/health:
    get:
      summary: Read service health
      operationId: getSystemHealth
      responses:
        '200':
          description: Health document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/seasons/{seasonId}/rounds/{round}/fixtures:
    get:
      summary: List normalized fixtures for one round
      operationId: listRoundFixtures
      parameters:
        - $ref: '#/components/parameters/SeasonId'
        - $ref: '#/components/parameters/Round'
      responses:
        '200':
          description: Fixture list
          content:
            application/json:
              schema:
                type: object
                required: [season_id, round, fixtures]
                properties:
                  season_id:
                    $ref: '#/components/schemas/SeasonId'
                  round:
                    $ref: '#/components/schemas/Round'
                  fixtures:
                    type: array
                    items:
                      $ref: '#/components/schemas/Fixture'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/matches/{matchId}/odds:
    get:
      summary: List retained odds snapshots for one match
      operationId: listMatchOdds
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MatchId'
      responses:
        '200':
          description: Odds snapshot list
          content:
            application/json:
              schema:
                type: object
                required: [match_id, snapshots]
                properties:
                  match_id:
                    $ref: '#/components/schemas/MatchId'
                  snapshots:
                    type: array
                    items:
                      $ref: '#/components/schemas/OddsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    SeasonId:
      name: seasonId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SeasonId'
    Round:
      name: round
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Round'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Request rejected by origin, CSRF, or internal access policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: vfl_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    Probability:
      type: object
      required: [home, draw, away]
      properties:
        home: {type: number, minimum: 0, maximum: 1}
        draw: {type: number, minimum: 0, maximum: 1}
        away: {type: number, minimum: 0, maximum: 1}
      description: Normalized mutually exclusive 1X2 probabilities derived from the scoreline matrix.
    DynamicTeamStrength:
      type: object
      required: [home_rating, away_rating, expected_home_goals, expected_away_goals, total_matches_used]
      properties:
        home_rating: {type: number}
        away_rating: {type: number}
        home_rating_uncertainty: {type: number, minimum: 0}
        away_rating_uncertainty: {type: number, minimum: 0}
        home_attack_strength: {type: number}
        away_attack_strength: {type: number}
        home_defense_strength: {type: number}
        away_defense_strength: {type: number}
        home_attack_uncertainty: {type: number, minimum: 0}
        away_attack_uncertainty: {type: number, minimum: 0}
        home_defense_uncertainty: {type: number, minimum: 0}
        away_defense_uncertainty: {type: number, minimum: 0}
        expected_home_goals: {type: number, minimum: 0}
        expected_away_goals: {type: number, minimum: 0}
        league_scoring_intercept: {type: number}
        home_advantage: {type: number}
        season_matches_used: {type: integer, minimum: 0}
        total_matches_used: {type: integer, minimum: 0}
        state_as_of: {type: string, format: date-time}
      description: Descriptive dynamic state used by the unified Phase 6 scoreline model.
    GoalMarkets:
      type: object
      required: [probability, lambda_home, lambda_away, over_2_5, under_2_5, both_teams_to_score, neither_team_scores]
      properties:
        probability:
          $ref: '#/components/schemas/Probability'
        lambda_home: {type: number, minimum: 0}
        lambda_away: {type: number, minimum: 0}
        expected_home_goals: {type: number, minimum: 0}
        expected_away_goals: {type: number, minimum: 0}
        over_2_5: {type: number, minimum: 0, maximum: 1}
        under_2_5: {type: number, minimum: 0, maximum: 1}
        both_teams_to_score: {type: number, minimum: 0, maximum: 1}
        neither_team_scores: {type: number, minimum: 0, maximum: 1}
        correct_scores:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        correct_score_residual_tail: {type: number, minimum: 0, maximum: 1}
      description: Goal markets derived from one normalized joint scoreline distribution.
    SeasonId:
      type: string
      pattern: '^[0-9]+$'
      example: '3149311'
    TournamentId:
      type: integer
      minimum: 1
      example: 14149
    MatchId:
      type: integer
      minimum: 1
      example: 1412171310
    TeamUid:
      type: integer
      minimum: 1
      example: 276506
    Round:
      type: integer
      minimum: 1
      maximum: 30
      example: 23
    DecimalOdds:
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?$'
      description: Positive decimal value stored as text; zero is rejected during normalization.
      example: '1.75'
    Score:
      type: object
      required: [home, away]
      properties:
        home:
          type: integer
          minimum: 0
        away:
          type: integer
          minimum: 0
    TeamRef:
      type: object
      required: [uid, name, abbreviation]
      properties:
        uid:
          $ref: '#/components/schemas/TeamUid'
        name:
          type: string
        abbreviation:
          type: string
        provider_id:
          type: integer
    Fixture:
      type: object
      required: [match_id, season_id, tournament_id, round, scheduled_uts, home, away, status]
      properties:
        match_id:
          $ref: '#/components/schemas/MatchId'
        season_id:
          $ref: '#/components/schemas/SeasonId'
        tournament_id:
          $ref: '#/components/schemas/TournamentId'
        round:
          $ref: '#/components/schemas/Round'
        scheduled_uts:
          type: integer
          format: int64
        home:
          $ref: '#/components/schemas/TeamRef'
        away:
          $ref: '#/components/schemas/TeamRef'
        score:
          oneOf:
            - $ref: '#/components/schemas/Score'
            - type: 'null'
        status:
          type: string
          enum: [scheduled, in_progress, completed, canceled, postponed, unknown]
    MarketIdentity:
      type: object
      required: [match_id, market_id, specifiers, outcome_id]
      properties:
        match_id:
          $ref: '#/components/schemas/MatchId'
        market_id:
          type: integer
          minimum: 1
        specifiers:
          type: string
          description: Canonical text key; provider URL decoding remains unvalidated.
        outcome_id:
          type: string
    OddsOutcome:
      type: object
      required: [id, raw_odds, active, provider_result]
      properties:
        id:
          type: string
        raw_odds:
          type: string
        odds:
          oneOf:
            - $ref: '#/components/schemas/DecimalOdds'
            - type: 'null'
        odds_error:
          type: string
        active:
          type: integer
        provider_result:
          type: integer
    OddsMarket:
      type: object
      required: [id, name, specifiers, status, outcomes]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        specifiers:
          type: string
        status:
          type: integer
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/OddsOutcome'
    OddsSnapshot:
      type: object
      required: [match_id, source_timestamp_millis, markets]
      properties:
        match_id:
          $ref: '#/components/schemas/MatchId'
        source_timestamp_millis:
          type: integer
          format: int64
        markets:
          type: array
          items:
            $ref: '#/components/schemas/OddsMarket'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/MarketIdentity'
    Health:
      type: object
      required: [status, phase, provider_connectivity]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        phase:
          type: string
          example: phase0
        provider_connectivity:
          type: string
          enum: [disabled, unvalidated, validated]
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: HTTP status code represented as text for stable client handling
        message:
          type: string
        error:
          type: string
          description: Backward-compatible error message field
